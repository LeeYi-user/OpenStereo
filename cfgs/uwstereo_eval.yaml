DATA_CONFIG:
    DATA_INFOS:
        -   DATASET: UWStereoDataset
            DATA_SPLIT: {
                EVALUATING: ./data/UWStereo/all_test.txt,
            }
            RETURN_SUPER_PIXEL: true

    DATA_TRANSFORM:
        EVALUATING:
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }

EVALUATOR:
    BATCH_SIZE_PER_GPU: 1
    MAX_DISP: 192
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3